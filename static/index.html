<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💘 AI Matchmaking Agent - Bà Mối AI (React Web UI)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Marked.js Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.9rem; }
        .markdown-body th, .markdown-body td { border: 1px solid rgba(255,255,255,0.15); padding: 8px 12px; text-align: left; }
        .markdown-body th { background: rgba(244, 63, 94, 0.15); color: #fda4af; }
        .markdown-body p { margin-bottom: 8px; line-height: 1.6; }
        .markdown-body ul { list-style-type: disc; padding-left: 20px; margin-bottom: 8px; }
        .markdown-body strong { color: #fecdd3; }
    </style>
</head>
<body class="h-full text-slate-100 bg-slate-950 overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Generate persistent Session ID
        function getSessionId() {
            let sid = localStorage.getItem('bm_session_id');
            if (!sid) {
                sid = 'session_' + Math.random().toString(36).substring(2, 11);
                localStorage.setItem('bm_session_id', sid);
            }
            return sid;
        }

        function App() {
            const [sessionId, setSessionId] = useState(getSessionId());
            const [selectedLevel, setSelectedLevel] = useState('level3');
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [loading, setLoading] = useState(false);
            const [showCandidatesModal, setShowCandidatesModal] = useState(false);
            const [candidates, setCandidates] = useState([]);
            const [toastMessage, setToastMessage] = useState(null);
            
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages, loading]);

            useEffect(() => {
                // Fetch mock candidates database on load
                fetch('/api/candidates')
                    .then(res => res.json())
                    .then(data => {
                        if (data.candidates) setCandidates(data.candidates);
                    })
                    .catch(err => console.error("Error fetching candidates:", err));
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // Handle Send Message
            const handleSend = async (textToSend) => {
                const text = textToSend || inputText;
                if (!text.trim() || loading) return;

                const userMsg = {
                    id: Date.now(),
                    role: 'user',
                    content: text.trim(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setMessages(prev => [...prev, userMsg]);
                setInputText('');
                setLoading(true);

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: text.trim(),
                            level: selectedLevel,
                            session_id: sessionId
                        })
                    });

                    const data = await res.json();
                    if (res.ok && data.response) {
                        const botMsg = {
                            id: Date.now() + 1,
                            role: 'assistant',
                            content: data.response,
                            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                        };
                        setMessages(prev => [...prev, botMsg]);
                    } else {
                        throw new Error(data.detail || "Lỗi phản hồi từ máy chủ");
                    }
                } catch (err) {
                    const errorMsg = {
                        id: Date.now() + 1,
                        role: 'assistant',
                        content: `❌ **Lỗi hệ thống**: ${err.message}`,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };
                    setMessages(prev => [...prev, errorMsg]);
                } finally {
                    setLoading(false);
                }
            };

            // Handle Reset Session
            const handleReset = async () => {
                try {
                    const res = await fetch('/api/reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId })
                    });
                    
                    if (res.ok) {
                        setMessages([]);
                        showToast("🧹 Đã xóa sạch 100% lịch sử và reset phiên làm việc thành công!");
                    }
                } catch (err) {
                    showToast("❌ Lỗi reset lịch sử!");
                }
            };

            const samplePrompts = [
                {
                    title: "🌸 Tìm Bạn Gái Hà Nội",
                    desc: "Nam 26t tìm bạn gái 22-26t ở Hà Nội thích nhạc indie & vẽ tranh",
                    query: "Tôi là Nam 26 tuổi ở Hà Nội, hãy tìm cho tôi bạn gái khoảng 22 đến 26 tuổi ở Hà Nội thích nghe nhạc indie, vẽ tranh và đi cà phê."
                },
                {
                    title: "📊 Đánh Giá Tương Thích",
                    desc: "Chấm điểm tương thích giữa hồ sơ C001 (Tuấn) và C002 (Bích)",
                    query: "Hãy đánh giá độ tương thích giữa hồ sơ C001 (Nguyễn Văn Tuấn) và C002 (Trần Thị Ngọc Bích)."
                },
                {
                    title: "💬 Test Slot Filling Loop",
                    desc: "Gửi câu hỏi thiếu vị trí/tuổi để test phanh an toàn Guardrail",
                    query: "Tôi muốn tìm bạn gái để tìm hiểu hẹn hò."
                },
                {
                    title: "🎯 Goal Cấp 4 Autonomous",
                    desc: "Tìm bạn phù hợp & lập kịch bản hẹn hò lãng mạn 3 bước",
                    query: "Tìm giúp tôi bạn gái phù hợp tại Hà Nội và lập kịch bản buổi hẹn hò đầu tiên lãng mạn cho 2 người."
                }
            ];

            return (
                <div class="h-full flex flex-col bg-slate-950">
                    {/* Header */}
                    <header class="h-16 px-6 glass-panel flex items-center justify-between z-10 border-b border-slate-800/60">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-pink-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                                <i class="fa-solid fa-heart text-white text-lg"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-lg text-white flex items-center space-x-2">
                                    <span>Bà Mối AI</span>
                                    <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-brand-500/20 text-brand-300 border border-brand-500/30">
                                        Production React UI
                                    </span>
                                </h1>
                                <p class="text-xs text-slate-400">AI Matchmaking Agent System • Powered by Groq Llama 3.3 70B</p>
                            </div>
                        </div>

                        <div class="flex items-center space-x-3">
                            <button 
                                onClick={() => setShowCandidatesModal(true)}
                                class="px-3.5 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all flex items-center space-x-2"
                            >
                                <i class="fa-solid fa-users text-pink-400"></i>
                                <span>Xem Hồ Sơ Mẫu ({candidates.length})</span>
                            </button>

                            <button 
                                onClick={handleReset}
                                class="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/40 transition-all flex items-center space-x-2 shadow-sm"
                            >
                                <i class="fa-solid fa-trash-can"></i>
                                <span>Xóa Sạch Lịch Sử</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Container */}
                    <div class="flex-1 flex overflow-hidden">
                        {/* Left Sidebar */}
                        <aside class="w-80 glass-panel border-r border-slate-800/60 p-4 flex flex-col justify-between hidden md:flex">
                            <div class="space-y-6">
                                {/* Level Selector */}
                                <div>
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                                        <i class="fa-solid fa-sliders mr-1.5 text-brand-400"></i>
                                        Chọn Cấp Độ AI System
                                    </h3>
                                    <div class="space-y-2">
                                        {[
                                            { id: 'level3', name: '🧠 Cấp 3: ReAct Agent', badge: 'Mặc định', desc: 'Suy luận Thought-Action, gọi Tool & hỏi thông tin thiếu' },
                                            { id: 'level4', name: '🚀 Cấp 4: Autonomous Agent', badge: 'Bonus +10%', desc: 'Planning 3 bước, Memory & Tự đánh giá mục tiêu' },
                                            { id: 'level2', name: '🤖 Cấp 2: LLM Chatbot', badge: 'Groq LLM', desc: 'Tư vấn văn bản mượt mà, không có công cụ' },
                                            { id: 'level1', name: '🤖 Cấp 1: Rule-Based Bot', badge: 'Keyword', desc: 'Khớp từ khóa if/else cố định' }
                                        ].map((lvl) => (
                                            <div 
                                                key={lvl.id}
                                                onClick={() => setSelectedLevel(lvl.id)}
                                                class={`p-3 rounded-xl cursor-pointer transition-all border ${
                                                    selectedLevel === lvl.id 
                                                        ? 'bg-brand-500/15 border-brand-500/50 text-white shadow-lg shadow-brand-500/10' 
                                                        : 'bg-slate-900/40 border-slate-800 hover:bg-slate-800/50 text-slate-300'
                                                }`}
                                            >
                                                <div class="flex items-center justify-between mb-1">
                                                    <span class="font-semibold text-xs">{lvl.name}</span>
                                                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-brand-300 border border-brand-500/20">{lvl.badge}</span>
                                                </div>
                                                <p class="text-[11px] text-slate-400 leading-snug">{lvl.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Sample Cards */}
                                <div>
                                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                                        <i class="fa-solid fa-lightbulb mr-1.5 text-amber-400"></i>
                                        Câu Hỏi Thử Nghiệm Mẫu
                                    </h3>
                                    <div class="space-y-2">
                                        {samplePrompts.map((sp, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleSend(sp.query)}
                                                class="w-full p-2.5 rounded-xl bg-slate-900/50 hover:bg-slate-800/80 border border-slate-800/80 text-left transition-all group"
                                            >
                                                <div class="text-xs font-semibold text-slate-200 group-hover:text-brand-300 transition-colors">{sp.title}</div>
                                                <div class="text-[11px] text-slate-400 line-clamp-1 mt-0.5">{sp.desc}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800 text-[11px] text-slate-400 space-y-1">
                                <div><strong>Session ID</strong>: <code class="text-pink-300">{sessionId}</code></div>
                                <div><strong>Groq Model</strong>: <span class="text-slate-300">llama-3.3-70b-versatile</span></div>
                            </div>
                        </aside>

                        {/* Right Chat Area */}
                        <main class="flex-1 flex flex-col bg-slate-950 relative">
                            {/* Messages Container */}
                            <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 custom-scrollbar">
                                {messages.length === 0 ? (
                                    <div class="h-full flex flex-col items-center justify-center text-center p-6 space-y-4">
                                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-pink-400 flex items-center justify-center shadow-xl shadow-brand-500/20 animate-pulse">
                                            <i class="fa-solid fa-heart text-white text-2xl"></i>
                                        </div>
                                        <div class="max-w-md space-y-2">
                                            <h2 class="text-xl font-bold text-white">Chào bạn! Bà Mối AI sẵn sàng tư vấn 💘</h2>
                                            <p class="text-xs text-slate-400 leading-relaxed">
                                                Hãy chọn một câu hỏi gợi ý ở góc trái hoặc nhập tiêu chí tìm kiếm đối tượng ghép đôi mong muốn vào ô bên dưới nhé!
                                            </p>
                                        </div>

                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-xl mt-4">
                                            {samplePrompts.map((sp, idx) => (
                                                <div 
                                                    key={idx}
                                                    onClick={() => handleSend(sp.query)}
                                                    class="p-3.5 rounded-xl glass-card hover:border-brand-500/40 text-left cursor-pointer transition-all hover:scale-[1.02]"
                                                >
                                                    <div class="text-xs font-bold text-brand-300 mb-1">{sp.title}</div>
                                                    <div class="text-xs text-slate-300 line-clamp-2">{sp.desc}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    messages.map((msg) => (
                                        <div 
                                            key={msg.id} 
                                            class={`flex space-x-3 ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                                        >
                                            {msg.role === 'assistant' && (
                                                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-pink-400 flex-shrink-0 flex items-center justify-center text-white text-sm shadow-md">
                                                    <i class="fa-solid fa-robot"></i>
                                                </div>
                                            )}

                                            <div class={`max-w-2xl rounded-2xl p-4 shadow-md ${
                                                msg.role === 'user'
                                                    ? 'bg-gradient-to-r from-brand-600 to-pink-600 text-white rounded-br-none'
                                                    : 'glass-card text-slate-100 border border-slate-800 rounded-bl-none'
                                            }`}>
                                                <div class="flex items-center justify-between text-[11px] mb-1 opacity-70">
                                                    <span class="font-semibold">{msg.role === 'user' ? 'Bạn' : 'Bà Mối AI'}</span>
                                                    <span>{msg.time}</span>
                                                </div>
                                                
                                                <div 
                                                    class="markdown-body text-xs md:text-sm leading-relaxed"
                                                    dangerouslySetInnerHTML={{ __html: marked.parse(msg.content) }}
                                                />
                                            </div>

                                            {msg.role === 'user' && (
                                                <div class="w-9 h-9 rounded-xl bg-slate-800 flex-shrink-0 flex items-center justify-center text-slate-300 text-sm border border-slate-700">
                                                    <i class="fa-solid fa-user"></i>
                                                </div>
                                            )}
                                        </div>
                                    ))
                                )}

                                {loading && (
                                    <div class="flex items-center space-x-3 text-slate-400 text-xs">
                                        <div class="w-8 h-8 rounded-xl bg-brand-500/20 flex items-center justify-center text-brand-400">
                                            <i class="fa-solid fa-spinner fa-spin"></i>
                                        </div>
                                        <span>Bà Mối AI đang suy luận & xử lý dữ liệu...</span>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Input Form */}
                            <div class="p-4 glass-panel border-t border-slate-800/60">
                                <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} class="flex items-center space-x-3">
                                    <input
                                        type="text"
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                        placeholder="Nhập tin nhắn tư vấn / tìm đối tượng ghép đôi..."
                                        class="flex-1 bg-slate-900 border border-slate-800 focus:border-brand-500/60 focus:ring-1 focus:ring-brand-500/60 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 outline-none transition-all"
                                    />
                                    <button
                                        type="submit"
                                        disabled={loading || !inputText.trim()}
                                        class="px-5 py-3 rounded-xl bg-gradient-to-r from-brand-600 to-pink-500 hover:from-brand-500 hover:to-pink-400 disabled:opacity-50 text-white font-semibold text-sm transition-all shadow-lg shadow-brand-500/20 flex items-center space-x-2"
                                    >
                                        <span>Gửi</span>
                                        <i class="fa-solid fa-paper-plane text-xs"></i>
                                    </button>
                                </form>
                            </div>
                        </main>
                    </div>

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div class="fixed bottom-20 right-6 px-4 py-3 rounded-xl bg-slate-900 border border-brand-500/50 text-white text-xs font-semibold shadow-2xl z-50 flex items-center space-x-2 animate-bounce">
                            <i class="fa-solid fa-circle-check text-brand-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Candidates Modal */}
                    {showCandidatesModal && (
                        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[80vh] flex flex-col shadow-2xl">
                                <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                                    <h3 class="font-bold text-sm text-white flex items-center space-x-2">
                                        <i class="fa-solid fa-database text-brand-400"></i>
                                        <span>Cơ Sở Dữ Liệu Hồ Sơ Mẫu (Mock Candidates Database)</span>
                                    </h3>
                                    <button onClick={() => setShowCandidatesModal(false)} class="text-slate-400 hover:text-white">
                                        <i class="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>
                                <div class="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-3">
                                    {candidates.map((c) => (
                                        <div key={c.id} class="p-3 rounded-xl bg-slate-950/60 border border-slate-800/80 flex justify-between items-start">
                                            <div>
                                                <div class="font-bold text-xs text-brand-300">
                                                    <code>{c.id}</code> - {c.name} ({c.age} tuổi, {c.location})
                                                </div>
                                                <div class="text-xs text-slate-300 mt-1">
                                                    💼 <strong>Nghề nghiệp</strong>: {c.occupation} | 📐 <strong>Chiều cao</strong>: {c.height_cm}cm | 🎓 {c.education}
                                                </div>
                                                <div class="text-xs text-slate-400 mt-1">
                                                    💖 <strong>Sở thích & Gu</strong>: {c.interests}
                                                </div>
                                            </div>
                                            <span class="text-[10px] px-2 py-0.5 rounded bg-brand-500/20 text-brand-300 border border-brand-500/30">
                                                {c.gender}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
